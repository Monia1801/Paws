<!DOCTYPE html>
<html lang="en">
<head>

  <title>Signup</title>
  <link rel="stylesheet" href="./styles/signup & login.css">
</head>

<body>
    <div class="signup-box">
      <h3>Enter Name</h3>
      <input type="text">
      <h3>Enter mail ID/Phone number</h3>

      <input type="password">

      <input type="password">
      <div class="login-btn">
        <button>Login</button>
      </div>
      <h3>Already have an account?<a href="./login.html">Login</a></h3>
    </div>
