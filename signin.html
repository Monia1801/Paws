<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="./styles/signup-signin.css">
</head>

<body>
  <div class="top">
    <img src="./images/logo.jpg">
    <h1>Paws</h1>
  </div>
  <div class="auth-box">
    <h2>Welcome Back!</h2>
    <p>Sign in to continue finding your perfect pet companion</p>
    <form>
      <label>Email</label>
      <input type="email" placeholder="Enter your email">
      <label>Password</label>
      <input type="password" placeholder="Enter your password">
      <div class="auth-btn-container">
        <button type="submit" id="signin-btn">Sign In</button>
      </div>
    </form>
    <p class="footer-text">Don't have an account? <a href="./signup.html">Sign Up</a></p>
  </div>
  <script src="./scripts/signup-signin.js"></script>
</body>
</html>
