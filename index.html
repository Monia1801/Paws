<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws Main</title>
  <link rel="stylesheet" href="./styles/index.css">
</head>
<body>

  <div class="navbar">
    <div class="left-navbar">
      <img src="./images/logo.jpg" id="logo">
      <h1>Paws</h1>
    </div>

    <div id="search-bar">
        <input type="text" placeholder="search here">
    </div>

    <div class="right-navbar">
      <h1>Add</h1>
      <h1>Profile</h1>
    </div>
  </div>  
  <div class="body-container">
    <div class="heading">
      <h3>Find Your Perfect Companion</h3>
      <p>Browse adorable pets looking for their forever homes or temporary care</p>
    </div>
  
    <div class="cards-container">
        <div class="card card1">
          <img src="./images/doggy.jpg" class="card-image">
          <div class="card-content">
            <h3>Buddy</h3>
            <p>Golden Retriever . 8 months</p>
            <p>San Francisco, CA</p>
          </div>
        </div>
        <div class="card card2">2</div>
        <div class="card card3">3</div>
        <div class="card card4">4</div>
        <div class="card card5">5</div>
        <div class="card card6">6</div>
    </div>
  </div>
</body>
</html>
