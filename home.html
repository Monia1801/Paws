<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws Main</title>
  <link rel="stylesheet" href="./styles/home.css">
</head>
  <body>

  <div class="navbar">
    <div class="left-navbar">
      <img src="./images/logo.jpg" id="logo">
      <h1>Paws</h1>
    </div>

    <div class="search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="search-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
      <input type="search" placeholder="Search pets by name, breed, location..." />
    </div>

    <div class="right-navbar">
      <button id="add">+ Add Pet</button>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="profile-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
    </div>
  </div>  

  <div class="body-container">
    <div class="heading">
      <h3>Find Your Perfect Companion</h3>
      <p>Browse adorable pets looking for their forever homes or temporary care</p>
    </div>
  
    <div class="cards-container"> </div>
  </div>

  <script type="module" src="./scripts/home.js"></script>
</body>
</html>
